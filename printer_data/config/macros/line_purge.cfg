# macros/line_purge.cfg

[gcode_macro LINE_PURGE]
description: Adaptive purge line in front of the first print object
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set th = printer.toolhead %}
    {% set nozzle_d = printer.configfile.settings.extruder.nozzle_diameter | float %}
    {% set filament_d = printer.configfile.settings.extruder.filament_diameter | float %}
    {% set filament_area = 3.14159265 * (filament_d / 2) ** 2 %}

    ##################################################################
    # Get print object bounds — fallback to bed center if none defined
    ##################################################################
    {% if printer.exclude_object.objects | length > 0 %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% set x_min = all_points | map(attribute=0) | min | float %}
        {% set x_max = all_points | map(attribute=0) | max | float %}
        {% set y_min = all_points | map(attribute=1) | min | float %}
    {% else %}
        {% set x_min = th.axis_minimum.x + 20 %}
        {% set x_max = th.axis_maximum.x - 20 %}
        {% set y_min = th.axis_maximum.y / 2 %}
    {% endif %}

    ##################################################################
    # Purge line geometry
    ##################################################################
    {% set purge_height = v.purge_line_height %}
    {% set purge_amount = v.purge_line_amount %}
    {% set line_length = (purge_amount * filament_area) / (purge_height * nozzle_d) %}

    {% set x_center = (x_min + x_max) / 2 %}
    {% set x_start = [[x_center - line_length / 2, th.axis_minimum.x + 5] | max,
                       th.axis_maximum.x - line_length - 5] | min %}
    {% set x_end   = [x_start + line_length, th.axis_maximum.x - 5] | min %}
    {% set purge_y = [y_min - v.purge_line_margin, th.axis_minimum.y + 5] | max %}

    ##################################################################
    # Speeds
    ##################################################################
    {% set move_spd   = (v.purge_line_flow / (purge_height * nozzle_d)) * 60 %}
    {% set travel_spd = th.max_velocity * 60 %}

    SAVE_GCODE_STATE NAME=line_purge
    G90
    M83
    G92 E0

    G0 X{x_start} Y{purge_y} Z{purge_height + 5} F{travel_spd}
    G0 Z{purge_height}

    {% if v.purge_line_tip > 0 %}
        G1 E{v.purge_line_tip} F{move_spd}
        G92 E0
    {% endif %}

    G1 X{x_end} E{purge_amount} F{move_spd}
    G1 X{x_end + 10} F{travel_spd}
    G92 E0
    G0 Z{purge_height + 5}

    RESTORE_GCODE_STATE NAME=line_purge
