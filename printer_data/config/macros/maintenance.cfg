# macros/maintenance.cfg

[gcode_macro LUBE_LEADSCREWS]
description: Cycles the bed up/down across full Z travel to spread freshly applied lube on the leadscrews. Parameters: CYCLES=<n> (default 3), SPEED=<mm/s> (default travel_z)
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set cycles = params.CYCLES|default(3)|int %}
    {% set speed = params.SPEED|default(v.travel_z)|float %}
    {% set min_z = printer.configfile.config["stepper_z"]["position_min"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set z_low = min_z + 2 %}
    {% set z_high = max_z - 2 %}

    CG28
    SET_DISPLAY_TEXT MSG="Lube Leadscrews: 0/{cycles}"
    G90
    {% for i in range(1, cycles + 1) %}
        G0 Z{z_high} F{speed * 60}
        M400
        G0 Z{z_low} F{speed * 60}
        M400
        SET_DISPLAY_TEXT MSG="Lube Leadscrews: {i}/{cycles}"
    {% endfor %}
    SET_DISPLAY_TEXT MSG="Lube Leadscrews: done"
