# macros/heatsoak.cfg

[gcode_macro _POLL_WAIT]
description: Poll SENSOR (a printer status object name, e.g. "heater_bed" or "temperature_sensor Chamber") every DWELL ms, up to MAX_TICKS times, showing LABEL + live temperature on the display, until it reaches TARGET (or MAX_TICKS is hit, whichever first).
gcode:
    {% set sensor    = params.SENSOR %}
    {% set target    = params.TARGET|float %}
    {% set dwell     = params.DWELL|default(5000)|int %}
    {% set max_ticks = params.MAX_TICKS|default(240)|int %}
    {% set label     = params.LABEL|default("Waiting") %}
    {% for i in range(max_ticks) %}
        _POLL_TICK SENSOR="{sensor}" TARGET={target} DWELL={dwell} LABEL="{label}"
    {% endfor %}

[gcode_macro _POLL_TICK]
description: One live-checked tick for _POLL_WAIT. Must stay a separate macro call, not inline Jinja inside _POLL_WAIT's own loop -- an entire gcode_macro renders to one flat gcode string before any of it executes, so a temperature check inline in that loop would be cached ONCE at render time and never see real progress (confirmed live: a bed-heat wait built that way froze its display at the render-time temperature for the full timeout while the bed kept heating normally in the background). A separate macro call gets its own fresh render -- and therefore a fresh temperature read -- every time it actually executes.
gcode:
    {% set sensor = params.SENSOR %}
    {% set target = params.TARGET|float %}
    {% set dwell  = params.DWELL|default(5000)|int %}
    {% set label  = params.LABEL|default("Waiting") %}
    {% if printer[sensor].temperature < target - 1 %}
        SET_DISPLAY_TEXT MSG="{label}: {printer[sensor].temperature|int}°C → {target|int}°C"
        G4 P{dwell}
    {% endif %}

[gcode_macro _HEAT_BED_WAIT]
description: Non-blocking poll wait for the bed to reach TARGET, with live display progress. A trailing M190 is the real guarantee the bed is at temp (near-instant if the ticks already got there).
gcode:
    {% set target = params.TARGET|float %}
    M140 S{target}
    _POLL_WAIT SENSOR="heater_bed" TARGET={target} DWELL=5000 MAX_TICKS=240 LABEL="Heating Bed"
    M190 S{target}

[gcode_macro _HEATSOAK_WAIT]
description: Wait up to MINUTES minutes or until chamber reaches TARGET°C, whichever comes first
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set sv = printer.save_variables.variables %}
    {% set aux_speed = sv.get('heatsoak_aux_fan_speed', v.heatsoak_aux_fan_speed) %}
    {% set minutes = params.MINUTES|default(sv.get('heatsoak_minutes', v.heatsoak_minutes))|int %}
    {% set target = params.TARGET|default(45)|int %}
    SET_FAN_SPEED FAN=auxiliary SPEED={aux_speed}
    _POLL_WAIT SENSOR="temperature_sensor Chamber" TARGET={target} DWELL=60000 MAX_TICKS={minutes} LABEL="Heatsoaking"
    _HEATSOAK_DONE

[gcode_macro _HEATSOAK_DONE]
description: Wrap up the heatsoak -- turn the aux fan back off and show the final chamber temp
gcode:
    SET_FAN_SPEED FAN=auxiliary SPEED=0
    SET_DISPLAY_TEXT MSG="Heatsoaking done — {printer["temperature_sensor Chamber"].temperature|int}°C"
