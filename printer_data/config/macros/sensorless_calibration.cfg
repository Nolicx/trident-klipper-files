# macros/sensorless_calibration.cfg
#
# Based on the official Voron sensorless-homing tuning method
# (docs.vorondesign.com/tuning/sensorless.html): find the highest SGTHRS
# that still reliably homes ("maximum"), find the lowest one before it
# gets inconsistent ("minimum"), then pick a value slightly on the
# sensitive side of the midpoint -- "I tend to shoot for something
# slightly LESS than halfway between minimum and maximum" (their words).
# That bias is deliberate: too-insensitive fails as a full-force crash
# into the frame (a real incident on this printer -- see CALIBRATE_
# SENSORLESS's header further down), too-sensitive at worst triggers
# early/inconsistently. The safer side to lean on is "more sensitive".
#
# ------------------------------------------------------------------
# Why finding the UPPER bound ("maximum") is NOT automated here
# ------------------------------------------------------------------
# The official method starts at SGTHRS=255 (least sensitive) and jumps
# down until homing first succeeds. Every value before that first
# success does NOT trigger -- and Klipper's "No trigger on X after full
# movement" is raised as a real command_error, which puts the printer
# into SHUTDOWN (needs a FIRMWARE_RESTART to clear), not a soft failure
# a script can catch and continue past. An automated descent from 255
# would shut the printer down on every single failing candidate. The
# official guide is manual at this stage for exactly that reason -- a
# human is there to notice the shutdown, clear it, and pick the next
# value. Find your "maximum" (or really, any single confirmed-working
# value near it) by hand first:
#   _SENSORLESS_TEST STEPPER=stepper_x AXIS=X VALUE=200 ATTEMPTS=1
# and adjust down in big jumps (e.g. 50) until it actually homes. If it
# shuts the printer down (no trigger), FIRMWARE_RESTART and try a lower
# value. That value becomes START below.
#
# ------------------------------------------------------------------
# What IS automated: the downward search for the lower bound ("minimum")
# ------------------------------------------------------------------
# From a confirmed-working START, decreasing (more sensitive) never hits
# that same hard-error class -- it either still triggers (maybe less
# consistently) or, at worst, triggers early, neither of which crashes
# the command chain. That makes it safe to automate as an adaptive
# search that stops itself at the real boundary, instead of a fixed
# range you have to eyeball afterward.
#
# Adaptive, not a flat {% for %} sweep: Klipper renders an entire
# gcode_macro to one flat gcode string before any of it executes, so
# Jinja-level branching on "was the last attempt good?" across loop
# iterations sees a stale, render-time snapshot, not the real result
# (the bug class fixed in macros/heatsoak.cfg's _HEAT_BED_WAIT, and
# again here in an earlier version of this file via a lost list-append).
# True adaptive looping also can't be done via a macro calling itself --
# Klipper explicitly blocks that ("Macro X called recursively"). The
# mechanism that actually works for "repeat until a live condition
# says stop" is a [delayed_gcode] re-arming itself via
# UPDATE_DELAYED_GCODE each time it wants another iteration, and simply
# not re-arming once the stop condition is met. See _SENSORLESS_DESCEND
# below.
#
# Usage:
#   CALIBRATE_SENSORLESS AXIS=X START=<your confirmed-working value>
# Optional: STEP=<default 5> ATTEMPTS=<default 5>
#           TOLERANCE=<mm, default derived from the stepper's own full-step
#             distance (TMC2209 StallGuard4 only resolves to whole full
#             steps -- see _SENSORLESS_ANALYZE for the exact derivation) --
#             max spread across ATTEMPTS to call a value "good">
#           APPROACH=<mm from the rail to test from, default 100 -- matches
#             the official guide's "~4 inches off the rail"; shorter test
#             travel than homing from bed center, and more representative
#             of the final tuned value since it's the same distance every
#             time, not a side effect of wherever the previous test parked>
#           BIAS=<0-1, default 0.4 -- fraction of the way from minimum
#             toward START/maximum; 0.4 matches the official guide's own
#             worked example (slightly below the midpoint, toward the
#             safer/more-sensitive side)>
#           PREHEAT_CHAMBER=<°C, default 0=off> PREHEAT_BED=<°C, default v.bed_temp_high>
#
# PREHEAT_CHAMBER reuses macros/heatsoak.cfg's shared _POLL_WAIT (same
# mechanism as PRINT_START's own heatsoak) to bring the frame/motors up to
# a representative operating temperature before searching -- StallGuard
# drifts with motor winding temperature, so a value calibrated stone-cold
# is not necessarily the value that holds once the printer has been
# running a while.
#
# At the end: reports maximum (=START), minimum (last good value found),
# and the recommended value (minimum + BIAS*(maximum-minimum)). Restores
# SGTHRS to START live -- NEVER touches printer.cfg. Verify the
# recommendation with VERIFY_SENSORLESS before committing it yourself to
# [autotune_tmc stepper_x/y] sg4_thrs + RESTART.

[gcode_macro CALIBRATE_SENSORLESS]
description: Adaptive downward search from a confirmed-working START SGTHRS to find the real lower bound, then recommends a value per the official Voron sensorless tuning method. See macros/sensorless_calibration.cfg header for usage and why the upper bound isn't auto-searched.
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set axis = params.AXIS|default("X")|upper %}
    {% set stepper = "stepper_x" if axis == "X" else "stepper_y" %}
    {% set start = params.START|int %}
    {% set step = params.STEP|default(5)|int %}
    {% set attempts = params.ATTEMPTS|default(5)|int %}
    {% set tolerance = params.TOLERANCE|default(-1)|float %}
    {% set approach = params.APPROACH|default(100)|float %}
    {% set bias = params.BIAS|default(0.4)|float %}
    {% set preheat_chamber = params.PREHEAT_CHAMBER|default(0)|float %}
    {% set preheat_bed = params.PREHEAT_BED|default(v.bed_temp_high)|float %}

    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=axis VALUE="'{axis}'"
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=stepper VALUE="'{stepper}'"
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=attempts VALUE={attempts}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=tolerance VALUE={tolerance}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=maximum VALUE={start}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=bias VALUE={bias}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=candidate VALUE={start}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=minimum VALUE=-1

    # A real, full G28 here homes Z for real. Without this, Z is never
    # properly homed and every subsequent G28 {X/Y} re-triggers
    # safe_z_home's z_hop branch for an UNHOMED Z on every single call (it
    # fakes a Z position via set_position, hops, then explicitly clears
    # Z's homed state again) -- moving Z every time instead of just
    # hopping-if-needed once Z is genuinely homed.
    CG28

    {% if preheat_chamber > 0 %}
        RESPOND MSG="=== Preheating: bed to {preheat_bed}C, chamber to {preheat_chamber}C ==="
        PARK
        _HEAT_BED_WAIT TARGET={preheat_bed}
        _POLL_WAIT SENSOR="temperature_sensor Chamber" TARGET={preheat_chamber} DWELL=60000 MAX_TICKS=30 LABEL="Preheating for calibration"
        RESPOND MSG="=== Preheat done, starting search ==="
    {% endif %}

    # Move to the test position: APPROACH mm back from the endstop (not
    # bed center) -- a shorter, fixed, representative travel distance for
    # every single attempt, matching the official guide's "~4 inches off
    # the rail" rather than homing from wherever CG28's home_xy_position
    # happens to be.
    {% set pmax = printer.configfile.config[stepper]["position_max"]|float %}
    {% set test_pos = pmax - approach %}
    G90
    G0 {axis}{test_pos} F{v.travel_xy * 60}
    _SENSORLESS_CAPTURE_START AXIS={axis}

    RESPOND MSG="=== CALIBRATE_SENSORLESS {axis}: searching downward from {start} (step {step}) ==="
    UPDATE_DELAYED_GCODE ID=_SENSORLESS_DESCEND DURATION=0.01

[gcode_macro VERIFY_SENSORLESS]
description: Apply a specific SGTHRS value and home ATTEMPTS times to confirm it before committing it to printer.cfg yourself.
gcode:
    {% set axis = params.AXIS|default("X")|upper %}
    {% set stepper = params.STEPPER|default("stepper_x" if axis == "X" else "stepper_y") %}
    {% set value = params.VALUE|int %}
    {% set attempts = params.ATTEMPTS|default(5)|int %}

    RESPOND MSG="=== VERIFY_SENSORLESS {axis}: testing {value} ==="
    _SENSORLESS_TEST STEPPER={stepper} AXIS={axis} VALUE={value} ATTEMPTS={attempts}
    RESPOND MSG="=== If consistent above: set [autotune_tmc {stepper}] sg4_thrs: {value} in printer.cfg + RESTART ==="

##################################################################
# Internal machinery -- see file header for why each step here is its
# own separate macro call / delayed_gcode tick instead of inline Jinja
# in a shared loop.
##################################################################

[gcode_macro _SENSORLESS_STATE]
description: Scratch state for CALIBRATE_SENSORLESS -- never call directly
variable_axis: "X"
variable_stepper: "stepper_x"
variable_step: 5
variable_attempts: 5
variable_tolerance: -1
variable_bias: 0.4
variable_maximum: 0
variable_minimum: -1
variable_candidate: 0
variable_positions: []
variable_start_pos: 0.0
variable_t_start: 0.0
gcode:
    # storage only

[gcode_macro _SENSORLESS_CAPTURE_START]
description: Record the current (freshly positioned) location as the fixed reference every search attempt returns to afterward
gcode:
    {% set pos = printer.toolhead.position[params.AXIS|lower] %}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=start_pos VALUE={pos}
    RESPOND MSG="=== Reference test position: {params.AXIS}={pos|round(3)}mm ==="

[delayed_gcode _SENSORLESS_DESCEND]
description: One adaptive step of the downward search. Tests the current candidate value; if consistent and plausible, saves it as the new minimum, steps down, and re-arms itself for another round. Stops (does not re-arm) the moment a candidate fails either check -- that boundary is where the real minimum was.
gcode:
    {% set state = printer["gcode_macro _SENSORLESS_STATE"] %}
    {% set value = state.candidate %}
    _SENSORLESS_TEST STEPPER={state.stepper} AXIS={state.axis} VALUE={value} ATTEMPTS={state.attempts} TOLERANCE={state.tolerance}
    {% if printer["gcode_macro _SENSORLESS_STATE"].minimum == value %}
        # _SENSORLESS_ANALYZE (called inside _SENSORLESS_TEST above) only
        # updates `minimum` when the value was good -- so seeing it match
        # here means this candidate passed. Step down and go again.
        SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=candidate VALUE={value - state.step}
        UPDATE_DELAYED_GCODE ID=_SENSORLESS_DESCEND DURATION=0.01
    {% else %}
        # This candidate did NOT pass (see the RESPOND from _SENSORLESS_
        # ANALYZE above for why: inconsistent or suspicious). `minimum`
        # already holds the last value that DID pass -- the real boundary.
        # Do not re-arm; finish up instead.
        _SENSORLESS_FINISH
    {% endif %}

[gcode_macro _SENSORLESS_FINISH]
description: Restores SGTHRS to the confirmed-safe maximum and reports the recommendation. Never writes to printer.cfg.
gcode:
    {% set state = printer["gcode_macro _SENSORLESS_STATE"] %}
    SET_TMC_FIELD STEPPER={state.stepper} FIELD=SGTHRS VALUE={state.maximum}
    RESPOND MSG="=== Done. SGTHRS restored live to {state.maximum} -- printer.cfg untouched. ==="
    {% if state.minimum >= 0 %}
        {% set recommended = (state.minimum + state.bias * (state.maximum - state.minimum))|round(0)|int %}
        RESPOND MSG="=== maximum={state.maximum}  minimum={state.minimum}  recommended={recommended} (minimum + {state.bias}*(max-min)) ==="
        RESPOND MSG="=== Next: VERIFY_SENSORLESS AXIS={state.axis} VALUE={recommended} ==="
    {% else %}
        RESPOND MSG="=== No consistent value found below {state.maximum} with STEP={state.step} -- try a smaller STEP, or STEP=1 near the boundary you already found by hand. ==="
    {% endif %}

[gcode_macro _SENSORLESS_TEST]
description: Set SGTHRS to VALUE once, home ATTEMPTS times, then analyze the spread of the resulting positions
gcode:
    {% set value = params.VALUE|int %}
    SET_TMC_FIELD STEPPER={params.STEPPER} FIELD=SGTHRS VALUE={value}
    G4 P300
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=positions VALUE="[]"
    RESPOND MSG="--- SGTHRS={value} ---"
    {% for i in range(params.ATTEMPTS|int) %}
        _SENSORLESS_HOME_ONCE AXIS={params.AXIS} VALUE={value} N={i + 1} OF={params.ATTEMPTS}
    {% endfor %}
    _SENSORLESS_ANALYZE VALUE={value} STEPPER={params.STEPPER} TOLERANCE={params.TOLERANCE|default(-1)}

[gcode_macro _SENSORLESS_HOME_ONCE]
description: Home once, verify the move actually took plausibly long before trusting the result, report, then return to the saved reference position.
gcode:
    {% set stepper = "stepper_x" if params.AXIS == "X" else "stepper_y" %}
    _SENSORLESS_MARK_START STEPPER={stepper}
    G28 {params.AXIS}
    # Hard safety gate BEFORE anything else trusts this result or moves
    # again. Position readback alone was not enough to catch this live:
    # SGTHRS=145 stalled after ~5cm, was accepted as a real home, and the
    # subsequent "return to start_pos" move then drove the head into the
    # gantry on the far side because position bookkeeping from that point
    # on was wrong. Elapsed time cannot lie the same way: a stall that
    # fires after only a few cm takes a fraction of the time a real
    # full-distance trigger does. Aborting HERE, before the return move
    # even runs, is what actually prevents that crash from happening again.
    _SENSORLESS_CHECK_TIMING AXIS={params.AXIS} STEPPER={stepper} VALUE={params.VALUE}
    _SENSORLESS_REPORT AXIS={params.AXIS} VALUE={params.VALUE} N={params.N} OF={params.OF}
    G90
    G0 {params.AXIS}{printer["gcode_macro _SENSORLESS_STATE"].start_pos} F{printer["gcode_macro _VARIABLES"].travel_xy * 60}

[gcode_macro _SENSORLESS_MARK_START]
description: Record estimated_print_time right before a homing move, in its own call so the read is fresh (not the render-time snapshot from before G28 even started)
gcode:
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=t_start VALUE={printer.toolhead.estimated_print_time}

[gcode_macro _SENSORLESS_CHECK_TIMING]
description: Hard-aborts the whole search if the preceding G28 completed suspiciously fast for the known travel distance -- the sign of a false/early stall, not a real endstop hit.
gcode:
    {% set cfg = printer.configfile.config[params.STEPPER] %}
    {% set start_pos = printer["gcode_macro _SENSORLESS_STATE"].start_pos %}
    {% set expected_dist = (start_pos - cfg["position_endstop"]|float)|abs %}
    {% set homing_speed = cfg["homing_speed"]|float %}
    {% set expected_min_time = (expected_dist / homing_speed) * 0.5 %}
    {% set elapsed = printer.toolhead.estimated_print_time - printer["gcode_macro _SENSORLESS_STATE"].t_start %}
    {% if elapsed < expected_min_time %}
        {% set _ = action_raise_error(
            "CALIBRATE_SENSORLESS: SGTHRS=%s on %s triggered after only %.2fs (expected >= %.2fs for %.0fmm at %.0fmm/s) -- almost certainly a FALSE early stall, not the real endstop. Aborting before the return move runs on top of now-untrustworthy position data."
            % (params.VALUE, params.AXIS, elapsed, expected_min_time, expected_dist, homing_speed)) %}
    {% endif %}

[gcode_macro _SENSORLESS_REPORT]
description: Record one fresh post-home position into _SENSORLESS_STATE.positions
gcode:
    {% set pos = printer.toolhead.position[params.AXIS|lower] %}
    # Explicit write-back via SET_GCODE_VARIABLE, not in-place list mutation
    # ({% do positions.append(pos) %}) -- confirmed live that the append
    # was lost: printer["gcode_macro X"] reads go through the same
    # per-render status snapshot that caused the original _HEAT_BED_WAIT
    # bug, so mutating the list object it hands back doesn't persist back
    # into _SENSORLESS_STATE's real stored variable. Building a NEW list
    # and writing it back through the macro's actual state-changing API
    # sidesteps that entirely.
    {% set new_positions = printer["gcode_macro _SENSORLESS_STATE"].positions + [pos] %}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=positions VALUE="{new_positions}"
    RESPOND MSG="  [{params.N}/{params.OF}] SGTHRS={params.VALUE}: {params.AXIS}={pos|round(3)}mm"

[gcode_macro _SENSORLESS_ANALYZE]
description: Called once all ATTEMPTS for one SGTHRS value have recorded a position -- computes the spread AND checks it against the true expected endstop position. Only on BOTH passing does this value become the new `minimum`.
gcode:
    {% set value = params.VALUE|int %}
    {% set stepper = params.STEPPER %}
    {% set positions = printer["gcode_macro _SENSORLESS_STATE"].positions %}
    {% if positions|length > 0 %}
        {% set cfg = printer.configfile.config[stepper] %}

        # Grounded tolerance, not a guessed round number: per Trinamic's
        # TMC2209 datasheet / AN-002, SG_RESULT (the StallGuard4 load
        # reading) updates once per full step, and "a stall always means
        # the loss of four full steps" -- with sfilt filtering enabled it's
        # explicitly averaged over 4 full steps. So StallGuard's own
        # detection granularity is coarser than a microstep by design, on
        # the order of 1-4 full steps, independent of how precisely the
        # mechanics could otherwise repeat. One full step here:
        {% set full_step_dist = cfg["rotation_distance"]|float / cfg["full_steps_per_rotation"]|float %}
        # Consistency check: expect repeat positions to land within the
        # filtered (4-full-step) detection window, plus ~50% margin for
        # real-world retract/dwell timing jitter -- not an arbitrary round
        # mm figure.
        {% set grounded_tolerance = full_step_dist * 4 * 1.5 %}
        {% set tolerance = params.TOLERANCE|default(-1)|float %}
        {% set tolerance = grounded_tolerance if tolerance < 0 else tolerance %}
        {% set spread = positions|max - positions|min %}
        {% set consistent = spread < tolerance %}

        # Consistency alone doesn't prove correctness: sensorless homing is a
        # SINGLE pass for Klipper (the confirmation 2nd pass only runs if the
        # 1st pass moved less than min_home_dist -- see klippy/extras/
        # homing.py home_rails), so a cable snag or belt irregularity well
        # past min_home_dist that happens to trip StallGuard at the SAME
        # wrong spot every time would look perfectly "consistent" here too.
        # Cross-check the measured position against where a real trigger
        # should land: position_endstop minus the single retract Klipper
        # always does afterward for sensorless homing (homing_retract_dist)
        # -- NOT position_endstop itself, since no 2nd pass re-approaches it.
        # Plausibility window: same full-step basis as above, with a wider
        # (2x the consistency tolerance's margin) allowance since this
        # compares against a theoretical ideal across the whole homing
        # cycle, not just repeat-to-repeat noise.
        {% set plausible_threshold = full_step_dist * 4 * 3 %}
        {% set expected = cfg["position_endstop"]|float - cfg["homing_retract_dist"]|float %}
        {% set avg_pos = (positions|sum) / (positions|length) %}
        {% set offset = (avg_pos - expected)|abs %}
        {% set plausible = offset < plausible_threshold %}

        {% set verdict = "GOOD" if (consistent and plausible) else
                          "INCONSISTENT (too sensitive?)" if not consistent else
                          "SUSPICIOUS -- %.1fmm off expected endstop, may be a false trigger, not the real limit"|format(offset) %}
        RESPOND MSG="  => spread={spread|round(3)}mm (tolerance {tolerance|round(2)}mm), {offset|round(2)}mm off expected {expected|round(1)}mm (allowed {plausible_threshold|round(2)}mm) -- {verdict}"

        {% if consistent and plausible %}
            SET_GCODE_VARIABLE MACRO=_SENSORLESS_STATE VARIABLE=minimum VALUE={value}
        {% endif %}
    {% endif %}
