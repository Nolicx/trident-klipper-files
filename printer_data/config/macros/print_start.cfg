# macros/print_start.cfg

[gcode_macro _HEAT_BED_WAIT]
description: Non-blocking poll wait for the bed to reach TARGET, with live display progress. Falls back to a plain blocking M190 if TARGET isn't reached within a generous safety window, so a bug in this loop can never leave the print running on an under-temp bed.
gcode:
    {% set target = params.TARGET|float %}
    M140 S{target}
    {% set max_ticks = 240 %}  # 240 * 5s = 20 min safety cap
    {% for i in range(max_ticks) %}
        {% if printer.heater_bed.temperature >= target - 1 %}
            {% break %}
        {% endif %}
        SET_DISPLAY_TEXT MSG="Heating Bed: {printer.heater_bed.temperature|int}°C → {target|int}°C"
        G4 P5000
    {% endfor %}
    {% if printer.heater_bed.temperature < target - 1 %}
        M190 S{target}
    {% endif %}

[gcode_macro _HEATSOAK_WAIT]
description: Wait up to MINUTES minutes or until chamber reaches TARGET°C, whichever comes first
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set sv = printer.save_variables.variables %}
    {% set aux_speed = sv.get('heatsoak_aux_fan_speed', v.heatsoak_aux_fan_speed) %}
    {% set minutes = params.MINUTES|default(5)|int %}
    {% set target = params.TARGET|default(45)|int %}
    SET_FAN_SPEED FAN=auxiliary SPEED={aux_speed}
    {% for i in range(minutes) %}
        _HEATSOAK_TICK TARGET={target}
    {% endfor %}
    _HEATSOAK_DONE

[gcode_macro _HEATSOAK_TICK]
gcode:
    {% set target = params.TARGET|default(45)|int %}
    {% if printer["temperature_sensor Chamber"].temperature < target %}
        SET_DISPLAY_TEXT MSG="Heatsoaking | {printer["temperature_sensor Chamber"].temperature|int}°C → {target}°C"
        G4 P60000
    {% endif %}

[gcode_macro _HEATSOAK_DONE]
gcode:
    SET_FAN_SPEED FAN=auxiliary SPEED=0
    SET_DISPLAY_TEXT MSG="Heatsoaking done — {printer["temperature_sensor Chamber"].temperature|int}°C"

[gcode_macro PRINT_START]
description: Full print start sequence — homes, heats, levels, meshes, purges
# Parameters:
#   BED=<°C>      — target bed temperature
#   EXTRUDER=<°C> — target extruder temperature
gcode:
    # Any pause flag at print start is stale by definition (e.g. M600 or a
    # manual pause fired while idle, with no print running to resume) — left
    # set, it makes a REAL pause later in this print (filament runout, M600)
    # silently no-op ("Print already paused") instead of actually stopping.
    CLEAR_PAUSE

    {% set v = printer["gcode_macro _VARIABLES"] %}
    # Runtime-tunable purge line overrides — SAVE_VARIABLE VARIABLE=<name>
    # VALUE=<x> to change live, falls back to macros/_variables.cfg defaults
    {% set sv = printer.save_variables.variables %}
    {% set purge_line_height = sv.get('purge_line_height', v.purge_line_height) %}
    {% set purge_line_width = sv.get('purge_line_width', v.purge_line_width) %}
    {% set purge_line_amount = sv.get('purge_line_amount', v.purge_line_amount) %}
    {% set purge_line_margin = sv.get('purge_line_margin', v.purge_line_margin) %}
    {% set purge_line_flow = sv.get('purge_line_flow', v.purge_line_flow) %}
    {% set purge_line_tip = sv.get('purge_line_tip', v.purge_line_tip) %}
    {% set mesh_max_deviation = sv.get('mesh_max_deviation', v.mesh_max_deviation) %}
    {% set mesh_max_slope = sv.get('mesh_max_slope', v.mesh_max_slope) %}

    {% set BED_TEMP = params.BED|int %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|int %}
    {% set PROBE_TEMP = v.probe_temp %}
    {% set CHAMBER_TEMP = printer["temperature_sensor Chamber"].temperature %}
    
    ##################################################################
    # 0. Load PID profile matching target temperature
    #    Obsolete for the extruder: it now runs MPC (_SET_MPC_MATERIAL
    #    below handles per-material thermal control instead of PID).
    #    Kept as reference in case heater_bed profiles get added later.
    ##################################################################
    # {% if EXTRUDER_TEMP >= 260 %}
    #     PID_PROFILE LOAD=ABS HEATER=extruder KEEP_TARGET=1
    # {% else %}
    #     PID_PROFILE LOAD=PLA HEATER=extruder KEEP_TARGET=1
    # {% endif %}
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}
    CASE_LIGHT_ON
    SET_DISPLAY_TEXT MSG="Preparing"
    G90                                                         # Absolute positioning
    M83                                                         # Extruder relative mode

    ##################################################################
    # 1. Home and park
    ##################################################################
    STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing All Axes"
    CG28
    PARK

    ##################################################################
    # 2. Heat bed and heatsoak
    #    Printer is parked → safe to heat without moving
    ##################################################################
    STATUS_HEATING_BED
    SET_DISPLAY_TEXT MSG="Heating Bed → {BED_TEMP}°C"
    {% if BED_TEMP > v.bed_temp_high %}
        SET_FAN_SPEED FAN=nevermore SPEED=1
    {% endif %}
    _HEAT_BED_WAIT TARGET={BED_TEMP}
    {% if BED_TEMP > v.bed_temp_high and CHAMBER_TEMP < v.chamber_temp_target %}
        STATUS_HEATSOAKING
        _HEATSOAK_WAIT MINUTES={v.heatsoak_minutes} TARGET={v.chamber_temp_target}
    {% endif %}

    ##################################################################
    # 3. Heat nozzle to probe temp
    #    150°C → safe for TAP probing, hot enough to wipe cleanly
    ##################################################################
    STATUS_HEATING_NOZZLE
    SET_DISPLAY_TEXT MSG="Heating Nozzle → {PROBE_TEMP}°C"
    M109 S{PROBE_TEMP}

    ##################################################################
    # 4. Clean nozzle and home Z
    #    Clean first → no filament residue on bed during Z home
    ##################################################################
    STATUS_CLEANING
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    CLEAN_NOZZLE
    STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing Z"
    G28 Z

    ##################################################################
    # 5. Z Tilt
    #    Levels the gantry → clean nozzle before re-homing Z
    ##################################################################
    STATUS_LEVELING
    SET_DISPLAY_TEXT MSG="Leveling Gantry"
    Z_TILT_ADJUST

    ##################################################################
    # 6. Clean before Z home and bed mesh
    #    Removes ooze from Z Tilt moves → accurate TAP probe
    ##################################################################
    STATUS_CLEANING
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    CLEAN_NOZZLE
    STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing Z"
    G28 Z

    ##################################################################
    # 7. Bed mesh calibration
    ##################################################################
    STATUS_MESHING
    SET_DISPLAY_TEXT MSG="Mapping Bed Mesh"
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    BED_MESH_CHECK MAX_DEVIATION={mesh_max_deviation} MAX_SLOPE={mesh_max_slope}

    ##################################################################
    # 8. Heat nozzle to print temp
    #    Park while heating → no ooze on bed
    ##################################################################
    STATUS_HEATING_NOZZLE
    SET_DISPLAY_TEXT MSG="Heating Nozzle → {EXTRUDER_TEMP}°C"
    M107                                                        # Part cooling off
    PARK
    M109 S{EXTRUDER_TEMP}

    ##################################################################
    # 9. Final clean and purge
    #    At print temp → clean wipe + SQUIGGLY_PURGE primes nozzle
    ##################################################################
    STATUS_CLEANING
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    CLEAN_NOZZLE
    STATUS_PRINTING
    SET_DISPLAY_TEXT MSG="Purging"
    SQUIGGLY_PURGE LINE_HEIGHT={purge_line_height} LINE_WIDTH={purge_line_width} PURGE_LENGTH={purge_line_amount} LINE_MARGIN={purge_line_margin} FLOWRATE={purge_line_flow} UNRETRACT_LENGTH={purge_line_tip}

    SET_DISPLAY_TEXT MSG="Printing"
