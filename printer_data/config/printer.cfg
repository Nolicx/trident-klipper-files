# printer.cfg

##################################################################
# Hardware Configuration
# Note: [constants] below is the single source of truth for bed_center_x/y
# and park_z_hop — referenced via ${constants.xxx} both here in printer.cfg
# and from macros/_variables.cfg. Axis max values are not duplicated at
# all; macros read them live from printer.configfile.config.
##################################################################

[constants]
# Motors
motor_xy:               moons-ms17hd6p420i
motor_z:                moons-le172s-t0804-300-cn-01-200

# TMC
run_current_xy:         1.4     # monitor otpw in klippy.log after long prints; April otpw at 1.25 (no otpw since)
home_current_xy:        0.5     # sensorless homing current
run_current_z:          0.8     # Voron stock is 0.6; 0.8 = more torque in StealthChop, same speed limit
sense_resistor:         0.110

# TMC autotune
motor_extruder:         moons-cse14hra1l410a
tmc_voltage:            24      # motor supply; TMC2209 max is 29 V
extra_hysteresis_xy:    0       # more hysteresis = more driver heat, XY runs hot
extra_hysteresis:       1       # extruder and Z (cool drivers)
tuning_goal_z:          silent       # silent = StealthChop (quiet, stalls >~18 mm/s), performance = SpreadCycle

# Kinematics XY
microsteps_xy:          16
rotation_distance_xy:   40

# Kinematics Z
microsteps_z:           32
rotation_distance_z:    4

# Z motion limits — also used as travel_z by macros/_variables.cfg
max_z_velocity:         15      # mm/s  — Voron stock; 20 and 25 stall one Z motor in StealthChop
max_z_accel:            350     # mm/s² — 500 stalled the Z motors

# XY homing (sensorless)
homing_speed_xy:        60
homing_retract_dist_xy: 5
homing_retract_speed_xy: 20
min_home_dist_xy:       20

# Z homing / probing — accuracy-relevant, keep slow
z_homing_speed:         20      # fast approach
z_second_homing_speed:  5       # precise final approach
probe_speed:            10      # lift_speed uses max_z_velocity

# XY travel between probe points (z_tilt_ng, bed_mesh)
probe_travel_speed:     300

# Bed center, referenced by safe_z_home/bed_mesh/resonance_tester below
# and by macros/_variables.cfg
bed_center_x:           148
bed_center_y:           150

# Z-hop used when parking, referenced by safe_z_home below and by
# macros/_variables.cfg
park_z_hop:             10

# Enable arc support (OrcaSlicer)
[gcode_arcs]
resolution: 0.1

#####################################################################
# Includes
#####################################################################

[include macros/_variables.cfg]
[include mainsail.cfg]
[include klippain-shaketune.cfg]

# Components
[include components/fans.cfg]
[include components/sensors.cfg]
[include components/probe.cfg]
[include components/case_lights.cfg]
[include components/stealthburner_leds.cfg]
[include components/disco_on_a_stick.cfg]

# Macros
[include macros/misc.cfg]
[include macros/maintenance.cfg]
[include macros/lighting_control.cfg]
[include macros/speed_test.cfg]
[include macros/park.cfg]
[include macros/clean_nozzle.cfg]
[include macros/filament.cfg]
[include macros/pause_resume.cfg]
[include macros/print_start.cfg]
[include macros/print_end.cfg]
[include macros/squiggly_purge.cfg]
[include macros/klipper_backup.cfg]


#####################################################################
# MCU
#####################################################################

[mcu]
canbus_uuid: 9840783ba80b

[mcu EBBCan]
canbus_uuid: 4b6ed847da46

#####################################################################
# Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 30000
max_z_velocity: ${constants.max_z_velocity}
max_z_accel: ${constants.max_z_accel}
square_corner_velocity: 5.0

#####################################################################
# TMC AutoTune
#####################################################################

[autotune_tmc stepper_x]
motor: ${constants.motor_xy}
tuning_goal: auto
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis_xy}
sg4_thrs: 130

[autotune_tmc stepper_y]
motor: ${constants.motor_xy}
tuning_goal: auto
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis_xy}
sg4_thrs: 140

[autotune_tmc extruder]
motor: ${constants.motor_extruder}
tuning_goal: auto
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis}

[autotune_tmc stepper_z]
motor: ${constants.motor_z}
tuning_goal: ${constants.tuning_goal_z}
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis}

[autotune_tmc stepper_z1]
motor: ${constants.motor_z}
tuning_goal: ${constants.tuning_goal_z}
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis}

[autotune_tmc stepper_z2]
motor: ${constants.motor_z}
tuning_goal: ${constants.tuning_goal_z}
voltage: ${constants.tmc_voltage}
extra_hysteresis: ${constants.extra_hysteresis}


#####################################################################
# X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: ${constants.microsteps_xy}
rotation_distance: ${constants.rotation_distance_xy}
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop   # war: ^EBBCan:gpio24
position_min: 0
position_endstop: 296
position_max: 296
homing_speed: ${constants.homing_speed_xy}
homing_retract_dist: ${constants.homing_retract_dist_xy}
homing_retract_speed: ${constants.homing_retract_speed_xy}
min_home_dist: ${constants.min_home_dist_xy}
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: true
run_current: ${constants.run_current_xy}
home_current: ${constants.home_current_xy}
current_change_dwell_time: 0.2
sense_resistor: ${constants.sense_resistor}
stealthchop_threshold: 0
diag_pin: ^PF4

[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: ${constants.microsteps_xy}
rotation_distance: ${constants.rotation_distance_xy}
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop   # war: ^PF3
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: ${constants.homing_speed_xy}
homing_retract_dist: ${constants.homing_retract_dist_xy}
homing_retract_speed: ${constants.homing_retract_speed_xy}
min_home_dist: ${constants.min_home_dist_xy}
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: true
run_current: ${constants.run_current_xy}
home_current: ${constants.home_current_xy}
current_change_dwell_time: 0.2
sense_resistor: ${constants.sense_resistor}
stealthchop_threshold: 0
diag_pin: ^PF3

#####################################################################
# Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: ${constants.rotation_distance_z}
microsteps: ${constants.microsteps_z}
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2.5
homing_speed: ${constants.z_homing_speed}
second_homing_speed: ${constants.z_second_homing_speed}
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true
run_current: ${constants.run_current_z}
sense_resistor: ${constants.sense_resistor}

[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: ${constants.rotation_distance_z}
microsteps: ${constants.microsteps_z}

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: ${constants.run_current_z}
sense_resistor: ${constants.sense_resistor}

[stepper_z2]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: ${constants.rotation_distance_z}
microsteps: ${constants.microsteps_z}

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: ${constants.run_current_z}
sense_resistor: ${constants.sense_resistor}

#####################################################################
# Extruder
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 23.0515
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio27
min_temp: 0
max_temp: 320
max_extrude_only_distance: 105
max_extrude_cross_section: 5

#MCP
#control: mpc
heater_power: 48
cooling_fan: fan_generic part_cooling
filament_density: 1.25
filament_heat_capacity: 2.20

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
interpolate: true
run_current: 0.65
sense_resistor: ${constants.sense_resistor}

#####################################################################
# Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 115

#####################################################################
# Homing and Gantry Adjustment
#####################################################################

[idle_timeout]
timeout: 3300

[safe_z_home]
home_xy_position: ${constants.bed_center_x}, ${constants.bed_center_y}
speed: 100
z_hop: ${constants.park_z_hop}

# Du führst `Z_TILT_CALIBRATE` einmalig aus, die Werte werden in die Config geschrieben,
# und danach profitiert jeder `Z_TILT_ADJUST` automatisch davon.
[z_tilt_ng]
adaptive_horizontal_move_z: True
z_positions:
    -50, 18
    150, 348
    350, 18
points:
    30, 5
    150, 270
    270, 5
extra_points:
    30, 125
    150, 125
    270, 125
    100, 270
    200, 270
speed: ${constants.probe_travel_speed}
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
increasing_threshold: 0.02          # Allow up to 0.02mm of noise between retries before aborting
# min_horizontal_move_z: 2


[bed_mesh]
speed: ${constants.probe_travel_speed}
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 276, 276
zero_reference_position: ${constants.bed_center_x}, ${constants.bed_center_y}
fade_start: 0.6
fade_end: 10.0
probe_count: 7, 7
algorithm: bicubic

#####################################################################
# Input Shaper / ADXL
#####################################################################

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: ${constants.bed_center_x}, ${constants.bed_center_y}, 50
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 59.4
damping_ratio_x: 0.036
shaper_type_y: mzv
shaper_freq_y: 41.4
damping_ratio_y: 0.164

#####################################################################
# Board Pins (EXP1 / EXP2)
#####################################################################

[board_pins]
aliases:
    EXP1_1=PE7,  EXP1_2=PG1,
    EXP1_3=PG0,  EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,
    EXP2_7=PE8,  EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

#####################################################################
# Runtime-tunable variables (cleaning/purge)
# Override defaults from macros/_variables.cfg live via e.g.
#   SAVE_VARIABLE VARIABLE=wipe_spd VALUE=180
# without editing files or restarting. See macros/_variables.cfg for
# which values are read through this override.
#####################################################################

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

