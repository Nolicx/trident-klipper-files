# macros/print_end.cfg

[gcode_macro PRINT_END]
description: Print end sequence — retracts, lowers bed, cleans nozzle, turns off heaters
gcode:
    {% set v = printer["gcode_macro _VARIABLES"] %}
    {% set purge_line_tip = printer.save_variables.variables.get('purge_line_tip', v.purge_line_tip) %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set nevermore_was_on = printer["fan_generic nevermore"].speed > 0 %}

    M400                                                        # Wait for buffer to clear
    G92 E0                                                      # Zero the extruder
    G1 E-{purge_line_tip} F3600                                 # Retract filament
    G92 E0

    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR

    ##################################################################
    # Move to fixed presentation position (max_z - end_z_clearance).
    # Never moves down through the just-printed part: if the print
    # finished above that height, only raise by end_z_raise instead.
    # end_z_clearance must stay > park_z_hop (see _variables.cfg) —
    # the M84 below unhomes Z, and the next G28's safe_z_home hop
    # then blindly adds park_z_hop on top of wherever we parked here.
    ##################################################################
    {% set z_target = [act_z + v.end_z_raise, max_z - v.end_z_clearance]|max %}
    {% set z_target = [z_target, max_z]|min %}
    G90
    G0 Z{z_target} F{v.travel_z * 60}

    ##################################################################
    # Clean nozzle — RETURN=0 keeps Z at presentation height
    ##################################################################
    CLEAN_NOZZLE RETURN=0

    M84

    SET_DISPLAY_TEXT MSG="Print Complete"
    CASE_LIGHT_OFF
    STATUS_READY

    ##################################################################
    # Nevermore post-print filter run (only if it was active)
    ##################################################################
    {% if nevermore_was_on and v.nevermore_post_delay > 0 %}
        SET_DISPLAY_TEXT MSG="Filtering — {v.nevermore_post_delay} min"
        G4 P{v.nevermore_post_delay * 60 * 1000}
        SET_DISPLAY_TEXT MSG="Print Complete"
    {% endif %}
    SET_FAN_SPEED FAN=nevermore SPEED=0
