##################################################################
# Central Printer Configuration
# All positions, speeds and dimensions in one place — these are the
# defaults. Values marked [live] can be overridden without editing
# this file or restarting: SAVE_VARIABLE VARIABLE=<name> VALUE=<x>
# (persists in saved_variables.cfg; see [save_variables] in printer.cfg)
##################################################################

[gcode_macro _VARIABLES]
description: Central configuration for all macros

##################################################################
## Brush and park position
## Physical position of the nozzle brush and park spot
## Measure these values from your actual printer
##################################################################
variable_brush_x_left:       42     # Left edge of brush → CLEAN_NOZZLE start position
variable_brush_x_right:      90     # Right edge of brush → CLEAN_NOZZLE end position
variable_brush_y:           300     # Y position of brush = axis_maximum.y (rear of bed)
variable_park_x:             90     # X position when parked → same as brush_x_right
variable_park_z_hop:         ${constants.park_z_hop}   # mm to raise Z when parking → prevents crashes
variable_end_z_raise:         5     # mm to raise Z at print end before moving to brush
variable_end_z_clearance:    30     # mm below Z max → fixed presentation height after print end
                                     # MUST stay > park_z_hop: PRINT_END's M84 unhomes Z, and
                                     # safe_z_home then forces a blind +park_z_hop move on the
                                     # next G28 regardless of actual position — too little
                                     # clearance here drives the bed straight into position_max

##################################################################
## Rear approach safety
## Near the rear of the bed (high Y), the toolhead must approach
## the brush in a specific order to avoid collisions
##################################################################
variable_safe_approach_y:   293     # Above this Y → approach via y_max-14 before moving X

##################################################################
## Bed mesh validation (BED_MESH_CHECK)
## Aborts PRINT_START if the freshly calibrated mesh looks wrong
## (e.g. debris under the probe, a bad point) instead of printing on it
##################################################################
variable_mesh_max_deviation:  1.0   # mm    - Max diff between highest/lowest mesh point [live]
variable_mesh_max_slope:     0.06   # mm/mm - Max slope between adjacent mesh points [live]

##################################################################
## Temperatures
##################################################################
variable_probe_temp:          150     # °C - Nozzle temp for Z probing (TAP safe temperature)
variable_purge_temp_min:      190     # °C - Minimum temp before purging is allowed
variable_bed_temp_high:        90     # °C - Above this bed temp → nevermore on + heatsoak if chamber cold
variable_chamber_temp_target:  40     # °C - Chamber target for heatsoak completion
variable_nevermore_post_delay:  2     # min - Nevermore runtime after print end (VOC filtering)

##################################################################
## Heatsoak durations
## Longer soak for high-temp materials (ABS/ASA) to stabilize
## the chamber before printing
##################################################################
variable_heatsoak_minutes:     5     # min - Heatsoak duration (max wait, stops early if chamber reaches target)

##################################################################
## Travel speeds
## Used for all non-printing moves (homing, parking, positioning)
##################################################################
variable_travel_xy:         400     # mm/s - XY travel speed
variable_travel_z:           20     # mm/s - Z travel speed
variable_accel_travel:     9000     # mm/s² - Acceleration for travel moves

##################################################################
## Process speeds
## Used during nozzle cleaning and purging
##################################################################
variable_wipe_spd:          150     # mm/s - Speed during nozzle wipe strokes [live]
variable_accel_wipe:       7000     # mm/s² - Acceleration during wipe [live]
variable_purge_spd:          11     # mm/s - Filament extrusion speed during purge [live]
variable_purge_ret:           5     # mm   - Retract length after purge to prevent ooze [live]
variable_ooze_dwell:       2500     # ms   - Wait after cooling to let filament solidify [live]
variable_filament_load_len:  50     # mm   - Length to extrude when loading filament
variable_filament_unload_len: 80    # mm   - Length to retract when unloading filament

##################################################################
## Purge line (SQUIGGLY_PURGE)
## https://github.com/mjonuschat/voron-mods/tree/main/Squiggly%20Purge
##################################################################
variable_purge_line_height:   0.3   # mm    - LINE_HEIGHT: purge line bead height [live]
variable_purge_line_width:    1.0   # mm    - LINE_WIDTH: target bead width (solver mode — keeps height/width below the 0.75 adhesion limit and needs a shorter path to place the full purge amount) [live]
variable_purge_line_amount:    30   # mm    - PURGE_LENGTH: filament to extrude [live]
variable_purge_line_margin:    50   # mm    - LINE_MARGIN: clearance from print area (adaptive mode) [live]
variable_purge_line_flow:      12   # mm³/s - FLOWRATE: purge line flow rate [live]
variable_purge_line_tip:       10   # mm    - UNRETRACT_LENGTH: also used as print_end retract distance [live]

##################################################################
## Cleaning mode selection
## Any combination can be enabled
##################################################################
variable_clean_do_wipe:      True   # Wipe: linear passes with snap-back toward bucket [live]
variable_clean_do_circular:  True   # Circular: semicircle scrub across brush width [live]

##################################################################
## Wipe settings
##################################################################
variable_wipe_qty:            3     # Number of full wipe strokes (left→right→left = 1 wipe) [live]
variable_wipe_return_mult:  1.5     # Speed multiplier for snap back toward bucket (right) [live]

##################################################################
## Circular scrub settings
## Semicircles along brush width, dipping only into -Y (stays within Y bounds)
## Brush width / (circle_radius * 2) determines number of arcs per pass
##################################################################
variable_circle_radius:       3     # mm - radius of each semicircle [live]
variable_circle_spd:         80     # mm/s - speed during arcs [live]
variable_circle_passes:       2     # Number of left→right sweeps across brush [live]

gcode:
    {action_respond_info("Running this macro does nothing, it is only used for storing variable values.")}